
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Jenkins Deployment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            padding: 55px 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            background: #14532d;
            color: #86efac;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #38bdf8;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚀</div>

        <h1>Welcome to My First Jenkins Deployment!</h1>

        <div class="status">● Successfully Deployed</div>

        <p>
            Hello mufasa This is my first website deployed using Jenkins.
            I am learning Continuous Integration and Continuous Deployment
            (CI/CD) with Jenkins, GitHub, and Docker.
        </p>

        <button onclick="alert('Congratulations! Your first Jenkins deployment page is working!')">
            Test My Website
        </button>

        <footer>
            Built with HTML & CSS | Powered by Jenkins CI/CD
        </footer>

    </div>

</body>
</html>
